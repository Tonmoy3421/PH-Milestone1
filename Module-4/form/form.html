<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitha Ghor</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>

    </header>
    <main>
        <section>
            <h2>Jamal ma pitha Ghor</h2>
            <form action="">
                <fieldset class="personal-info">
                    <legend>Personal Info</legend>
                    <label for="name">Your name</label>
                <input type="text" name="" id="name">
                <label for="email">Enter Email</label>
                <input type="email" id="email">

                </fieldset>
                
                <fieldset>
                    <legend>Pitha Info</legend>
                    <input type="radio" name="pitha" id="chitoy">
                    <label for="chitoy">chitoy</label>

                    <input type="radio" name="pitha" id="vapa">
                    <label for="vapa">Vapa</label>

                    <input type="radio" name="pitha" id="guta">
                    <label for="guta">Guta pitha</label>

                    <input type="radio" name="pitha" id="dim">
                    <label for="dim">Dim pitha</label>

                </fieldset>   

                <fieldset>
                    <legend>Vorta selection</legend>
                    <input type="checkbox" name="" id="shorisha">
                    <label for="shorisha">Shorisha</label>
                    <input type="checkbox" name="" id="ilish">
                    <label for="ilish">Ilish</label>
                    <input type="checkbox" name="" id="murgi">
                    <label for="murgi">Murgi</label>
                    <input type="checkbox" name="" id="shutki">
                    <label for="shutki">Shutki</label>
                </fieldset>
                <fieldset>
                    <legend>more info</legend>
                    <textarea cols="50" rows="4" name="" id=""></textarea>
                </fieldset>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
